name: Firmware CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  OTA_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/ota-manifest.json

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install ESP Xtensa Rust toolchain
        uses: esp-rs/xtensa-toolchain@ec6d36527049a7f4fb2cb0c1a644668c1bb8a2a4 # v1.7.0
        with:
          default: true
          buildtargets: esp32s3
          version: 1.95.0.0
          ldproxy: true

      # esp-idf-sys otherwise clones ESP-IDF and downloads its toolchains on every
      # run, which is both the slowest step and the only one that depends on an
      # external CDN. The `dist` archives are excluded: they are only the download
      # staging area, and idf_tools does not need them once the tools are extracted.
      # The key follows .cargo/config.toml, which pins ESP_IDF_VERSION.
      - name: Restore ESP-IDF and its toolchains
        id: embuild
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .embuild
            !.embuild/espressif/dist
          key: embuild-${{ runner.os }}-${{ hashFiles('.cargo/config.toml') }}
          restore-keys: embuild-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint firmware
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build release firmware
        run: cargo build --locked --release

      # Saved only on success, and only when the exact key was missing, so a
      # half-finished install can never be handed to a later run.
      - name: Save ESP-IDF and its toolchains
        if: success() && steps.embuild.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .embuild
            !.embuild/espressif/dist
          key: ${{ steps.embuild.outputs.cache-primary-key }}

  # The artwork preview shares the firmware's modules, so it breaks whenever they
  # change shape. It needs no Xtensa toolchain: `+stable` overrides the esp
  # channel in rust-toolchain.toml and ignores the build-std setting in
  # .cargo/config.toml, and the explicit target overrides the board target there.
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build the clock artwork preview
        run: |
          cargo +stable build --locked \
            --manifest-path tools/backdrop-preview/Cargo.toml \
            --target "$(rustc +stable -vV | sed -n 's/^host: //p')"
